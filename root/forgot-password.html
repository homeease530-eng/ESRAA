<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور - في خدمتك</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Cairo', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .forgot-box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 450px;
    }
    .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        width: 100%;
        color: white;
        cursor: pointer;
    }
    a {
        color: #667eea;
        text-decoration: none;
    }
</style>
</head>
<body>
<div class="forgot-box">
    <h3 class="text-center mb-4">نسيت كلمة المرور</h3>
    <p class="text-center text-muted mb-4">أدخل بريدك الإلكتروني وسنرسل لك كود إعادة التعيين</p>
    
    <div class="mb-3">
        <label class="form-label">البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="example@mail.com">
    </div>
    
    <div id="codeSection" style="display: none;">
        <div class="mb-3">
            <label class="form-label">كود التحقق</label>
            <input type="text" id="code" class="form-control" placeholder="أدخل الكود المرسل">
        </div>
        <div class="mb-3">
            <label class="form-label">كلمة المرور الجديدة</label>
            <input type="password" id="newPassword" class="form-control" placeholder="********">
        </div>
    </div>
    
    <button class="btn-submit" id="actionBtn" onclick="sendCode()">إرسال الكود</button>
    <div class="text-center mt-3">
        <a href="login.html">العودة إلى تسجيل الدخول</a>
    </div>
    <div id="message" class="mt-3 text-center"></div>
</div>

<script>
    let step = 'send'; // send أو reset
    
    async function sendCode() {
        const email = document.getElementById('email').value;
        const messageDiv = document.getElementById('message');
        
        if (!email) {
            messageDiv.innerHTML = '<div class="alert alert-danger">يرجى إدخال البريد الإلكتروني</div>';
            return;
        }
        
        const btn = document.getElementById('actionBtn');
        btn.disabled = true;
        btn.innerHTML = 'جاري الإرسال...';
        messageDiv.innerHTML = '';
        
        try {
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await response.json();
            
            if (data.success) {
                messageDiv.innerHTML = '<div class="alert alert-success">✅ ' + data.message + '</div>';
                if (data.resetCode) {
                    messageDiv.innerHTML += '<div class="alert alert-info">📧 كود التحقق: <strong>' + data.resetCode + '</strong></div>';
                }
                // إظهار حقل الكود وكلمة السر الجديدة
                step = 'reset';
                document.getElementById('codeSection').style.display = 'block';
                document.getElementById('actionBtn').innerHTML = 'إعادة تعيين كلمة المرور';
                document.getElementById('actionBtn').onclick = resetPassword;
            } else {
                messageDiv.innerHTML = '<div class="alert alert-danger">❌ ' + data.message + '</div>';
            }
        } catch (error) {
            messageDiv.innerHTML = '<div class="alert alert-danger">❌ تعذر الاتصال بالسيرفر</div>';
        } finally {
            btn.disabled = false;
        }
    }
    
    async function resetPassword() {
        const email = document.getElementById('email').value;
        const code = document.getElementById('code').value;
        const newPassword = document.getElementById('newPassword').value;
        const messageDiv = document.getElementById('message');
        
        if (!code || !newPassword) {
            messageDiv.innerHTML = '<div class="alert alert-danger">يرجى إدخال الكود وكلمة المرور الجديدة</div>';
            return;
        }
        
        if (newPassword.length < 6) {
            messageDiv.innerHTML = '<div class="alert alert-danger">كلمة المرور يجب أن تكون 6 أحرف على الأقل</div>';
            return;
        }
        
        const btn = document.getElementById('actionBtn');
        btn.disabled = true;
        btn.innerHTML = 'جاري إعادة التعيين...';
        
        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, newPassword })
            });
            const data = await response.json();
            
            if (data.success) {
                messageDiv.innerHTML = '<div class="alert alert-success">✅ ' + data.message + ' سيتم تحويلك إلى صفحة تسجيل الدخول</div>';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                messageDiv.innerHTML = '<div class="alert alert-danger">❌ ' + data.message + '</div>';
                btn.disabled = false;
                btn.innerHTML = 'إعادة تعيين كلمة المرور';
            }
        } catch (error) {
            messageDiv.innerHTML = '<div class="alert alert-danger">❌ تعذر الاتصال بالسيرفر</div>';
            btn.disabled = false;
            btn.innerHTML = 'إعادة تعيين كلمة المرور';
        }
    }
</script>
</body>
</html>
