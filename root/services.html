<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخدمات - في خدمتك</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Cairo', sans-serif;
            padding-top: 80px;
        }
        .navbar {
            background: #1a1a2e !important;
        }
        .title {
            text-align: center;
            margin: 40px 0;
        }
        .title h2 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1a1a2e;
        }
        .service-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
        }
        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        .service-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-body {
            padding: 20px;
            text-align: center;
        }
        .card-body i {
            color: #667eea;
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            margin-top: 15px;
        }
        .btn-custom:hover {
            transform: scale(1.05);
        }
        .why-choose {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 50px;
            margin-top: 60px;
            border-radius: 30px 30px 0 0;
        }
        .why-choose h3 {
            font-size: 2rem;
            margin-bottom: 30px;
        }
        .point {
            font-size: 1.1rem;
            margin: 15px 0;
        }
        .point i {
            margin-left: 10px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
    </style>
</head>

    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fas fa-layer-group"></i> HomeEase
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="services.html">الخدمات</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">عن مشروعنا</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="compliants.html">💬 الشكاوى</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">📞 تواصل معنا</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="login.html">🔑 تسجيل دخول</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="signup.html">👤 إنشاء حساب</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-primary ms-2" href="booking.html">📝 طلب خدمة</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="title">
    <h2>خدماتنا</h2>
    <p class="text-muted">اختر الخدمة التي تناسب احتياجاتك بسهولة</p>
</div>

<!-- Services Grid -->
<div class="container">
    <div id="services-container" class="row g-4">
        <div class="loading">
            <div class="spinner"></div>
            <p>جاري تحميل الخدمات...</p>
        </div>
    </div>
</div>

<!-- Why Choose Us -->
<div class="why-choose">
    <h3>لماذا تختارنا؟</h3>
    <p class="point"><i class="fas fa-check-circle"></i> سرعة في تقديم الخدمة بأعلى جودة</p>
    <p class="point"><i class="fas fa-check-circle"></i> فريق متخصص وموثوق</p>
    <p class="point"><i class="fas fa-check-circle"></i> دعم متواصل واهتمام بكل التفاصيل</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
    AOS.init({ duration: 1000 });
</script>

<script>
    // جلب الخدمات من الباك إند
    async function loadServices() {
        const container = document.getElementById('services-container');
        
        try {
            const response = await fetch('/api/services');
            const data = await response.json();
            
            if (data.success && data.services) {
                displayServices(data.services);
            } else {
                container.innerHTML = '<div class="col-12 text-center"><p class="text-danger">❌ فشل في تحميل الخدمات</p></div>';
            }
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = '<div class="col-12 text-center"><p class="text-danger">❌ تعذر الاتصال بالسيرفر</p></div>';
        }
    }
    
    function displayServices(services) {
        const container = document.getElementById('services-container');
        container.innerHTML = '';
        
        // أيقونات لكل خدمة
        const icons = {
            'cleaning': 'fas fa-broom',
            'maintenance': 'fas fa-tools',
            'medical-care': 'fas fa-stethoscope',
            'special-needs': 'fas fa-wheelchair'
        };
        
        // صور لكل خدمة
        const images = {
            'cleaning': 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
            'maintenance': 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=800&q=80',
            'medical-care': 'https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=800&q=80',
            'special-needs': 'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&w=800&q=80'
        };
        
        services.forEach((service, index) => {
            const icon = icons[service.name] || 'fas fa-service';
            const image = images[service.name] || 'https://via.placeholder.com/800x600?text=Service';
            
            const card = document.createElement('div');
            card.className = 'col-md-6 col-lg-3';
            card.setAttribute('data-aos', 'fade-up');
            card.setAttribute('data-aos-delay', (index * 100).toString());
            
            card.innerHTML = `
                <div class="service-card">
                    <img src="${image}" class="service-img" alt="${service.nameAr}">
                    <div class="card-body">
                        <i class="${icon} fa-2x mb-2"></i>
                        <h5>${service.nameAr}</h5>
                        <p class="text-primary fw-bold">${service.price} جنيه</p>
                        <p>خدمة ${service.nameAr} بأعلى جودة وبأسعار منافسة</p>
                        <a href="booking.html?service=${service.name}" class="btn btn-primary btn-custom">احجز الآن</a>
                    </div>
                </div>
            `;
            
            container.appendChild(card);
        });
    }
    
    // تحميل الخدمات عند فتح الصفحة
    loadServices();
</script>
