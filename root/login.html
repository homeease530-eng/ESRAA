<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - خدمات النظافة والصيانة</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #0a3c5d, #1F3C88, #5893D4, #8EC5FC);
        font-family: 'Cairo', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow-x: hidden;
        margin: 0;
        padding: 20px;
    }
    .login-box {
        background: rgba(255,255,255,0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 450px;
        position: relative;
        z-index: 10;
    }
    .input-group {
        margin-bottom: 20px;
        position: relative;
    }
    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }
    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
    }
    .input-group i {
        position: absolute;
        left: 15px;
        bottom: 12px;
        cursor: pointer;
        color: #666;
    }
    .btn-login {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        width: 100%;
        color: white;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-login:hover {
        transform: scale(1.02);
    }
    .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    a {
        color: #667eea;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
    .text-white {
        color: #333 !important;
    }
    .waves {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 1;
        pointer-events: none;
    }
    @media (max-width: 768px) {
        .login-box {
            padding: 30px 20px;
            margin: 20px;
        }
    }
</style>
</head>

<body>
<div class="login-box">
    <h3 class="text-center mb-4">تسجيل الدخول</h3>

    <div class="input-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="ادخل بريدك الإلكتروني">
    </div>

    <div class="input-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="ادخل كلمة المرور">
        <i class="fa fa-eye" onclick="showPassword()"></i>
    </div>

    <div class="d-flex justify-content-between mb-3">
        <div><input type="checkbox" id="remember"> تذكرني</div>
        <a href="forgot-password.html">نسيت كلمة المرور؟</a>
    </div>

    <button class="btn-login mb-3" onclick="login()" id="loginBtn">تسجيل الدخول</button>

    <div class="text-center mt-3">
        ليس لديك حساب؟ <a href="signup.html">إنشاء حساب</a>
    </div>
</div>

<!-- Waves SVG -->
<svg class="waves wave1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
<path fill="#ffffff" fill-opacity="0.3" d="M0,192L48,176C96,160,192,128,288,117.3C384,107,480,117,576,144C672,171,768,213,864,224C960,235,1056,213,1152,186.7C1248,160,1344,128,1392,112L1440,96L1440,320L0,320Z"></path>
</svg>
<svg class="waves wave2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
<path fill="#ffffff" fill-opacity="0.5" d="M0,224L60,202.7C120,181,240,139,360,122.7C480,107,600,117,720,144C840,171,960,213,1080,224C1200,235,1320,213,1380,202.7L1440,192L1440,320L0,320Z"></path>
</svg>
<svg class="waves wave3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
<path fill="#ffffff" fill-opacity="0.7" d="M0,256L80,240C160,224,320,192,480,176C640,160,800,160,960,176C1120,192,1280,224,1360,240L1440,256L1440,320L0,320Z"></path>
</svg>

<script>
function showPassword() {
    let passInput = document.getElementById("password");
    passInput.type = passInput.type === "password" ? "text" : "password";
}

async function login() {
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;
    let btn = document.getElementById("loginBtn");
    
    if (!email || !pass) {
        alert("يرجى إدخال البريد الإلكتروني وكلمة المرور");
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = "جاري تسجيل الدخول...";
    
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: pass })
        });
        
        const data = await response.json();
        console.log("📦 Response:", data);
        
        if (data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('userId', data.user.id);
            localStorage.setItem('userName', data.user.fullName);
            localStorage.setItem('userRole', data.user.role);
            localStorage.setItem('userEmail', data.user.email);
            
            // تذكرني
            if (document.getElementById('remember').checked) {
                localStorage.setItem('rememberEmail', email);
            }
            
            alert("✅ تم تسجيل الدخول بنجاح");
            
            // المشرف الوحيد المسموح له هو admin@service.com
            if (data.user.role === 'admin' && data.user.email === 'admin@service.com') {
                window.location.href = 'workers.html';
            } else if (data.user.role === 'admin') {
                alert("❌ هذا الحساب ليس له صلاحية الوصول للوحة المشرفين");
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        } else {
            alert("❌ خطأ: " + data.message);
        }
    } catch (error) {
        console.error("❌ Error:", error);
        alert("❌ تعذر الاتصال بالسيرفر");
    } finally {
        btn.disabled = false;
        btn.innerHTML = "تسجيل الدخول";
    }
}

// تحميل البريد المحفوظ من تذكرني
document.addEventListener('DOMContentLoaded', function() {
    const rememberedEmail = localStorage.getItem('rememberEmail');
    if (rememberedEmail) {
        document.getElementById('email').value = rememberedEmail;
        document.getElementById('remember').checked = true;
    }
});
</script>

</body>
</html>
