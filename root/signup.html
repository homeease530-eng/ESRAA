<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - في خدمتك</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            padding-top: 70px;
        }
        .navbar {
            background: #1a1a2e !important;
        }
        .signup-box {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .signup-box h3 {
            color: #333;
            font-weight: bold;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-signup {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            color: white;
            cursor: pointer;
        }
        .btn-signup:hover {
            transform: scale(1.02);
        }
        .btn-signup:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="fas fa-layer-group"></i> HomeEase
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="services.html">الخدمات</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">عن مشروعنا</a></li>
        <li class="nav-item"><a class="nav-link" href="compliants.html">💬 الشكاوى</a></li>
        <li class="nav-item"><a class="nav-link" href="job.html"><i class="fas fa-briefcase"></i> وظائف</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="contact.html">📞 تواصل معنا</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">🔑 تسجيل دخول</a></li>
        <li class="nav-item"><a class="nav-link active" href="signup.html">👤 إنشاء حساب</a></li>
        <li class="nav-item"><a class="btn btn-primary ms-2" href="booking.html">📝 طلب خدمة</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="signup-box">
    <h3 class="text-center mb-4">إنشاء حساب جديد</h3>

    <div class="input-group">
        <label>الاسم الكامل</label>
        <input type="text" id="fullName" placeholder="ادخل اسمك الكامل">
    </div>

    <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@mail.com">
    </div>

    <div class="input-group">
        <label>رقم الهاتف</label>
        <input type="tel" id="phone" placeholder="01xxxxxxxxx">
    </div>

    <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="********">
    </div>

    <button class="btn-signup" onclick="signup()" id="signupBtn">إنشاء الحساب</button>

    <div class="login-link">
        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>
</div>

<script>
async function signup() {
    const fullName = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('signupBtn');

    if (!fullName || !email || !password) {
        alert("يرجى ملء الاسم والبريد وكلمة المرور");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = "جاري المعالجة...";

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, email, phone, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
            alert("✅ تم التسجيل بنجاح!");
            window.location.href = "login.html";
        } else {
            alert("❌ خطأ: " + data.message);
        }
    } catch (error) {
        console.error("Error:", error);
        alert("❌ تعذر الاتصال بالسيرفر");
    } finally {
        btn.disabled = false;
        btn.innerHTML = "إنشاء الحساب";
    }
}
</script>

</body>
</html>
