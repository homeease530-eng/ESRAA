<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - إدارة العمال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: #f5f7fb;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 {
            color: #1e293b;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            background: white;
            color: #2563eb;
            border: 1px solid #e2e8f0;
        }
        .nav-btn.active {
            background: #2563eb;
            color: white;
        }
        .logout-btn {
            background: #dc2626;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }
        .stat-card .small {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters select, .filters input {
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
        }
        .add-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            margin-right: auto;
        }
        .workers-table {
            background: white;
            border-radius: 20px;
            overflow-x: auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        th, td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f8fafc;
            color: #1e293b;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-available { background: #d1fae5; color: #059669; }
        .status-busy { background: #fee2e2; color: #dc2626; }
        .status-vacation { background: #fef3c7; color: #d97706; }
        button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin: 0 5px;
            padding: 5px;
        }
        .btn-edit { color: #2563eb; }
        .btn-delete { color: #dc2626; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-modal {
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #475569;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .worker-image {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #e2e8f0;
        }
        @media (max-width: 768px) {
            th, td {
                padding: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👷 إدارة العمال</h1>
            <div class="nav-links">
                <a href="/admin-requests" class="nav-btn">📋 الطلبات</a>
                <a href="/admin-workers" class="nav-btn active">👷 العمال</a>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 تسجيل خروج</button>
        </div>
               
<td>
  ${worker.location ? 
    `<i class="fas fa-map-marker-alt"></i> <a href="https://www.google.com/maps?q=${worker.location.lat},${worker.location.lng}" target="_blank">عرض الموقع</a>` : 
    '-'}
</td>








        <div class="stats" id="stats-container">
            <div class="stat-card"><h3>إجمالي العمال</h3><div class="number" id="stat-total">-</div></div>
            <div class="stat-card"><h3>متاح</h3><div class="number" id="stat-available">-</div></div>
            <div class="stat-card"><h3>مشغول</h3><div class="number" id="stat-busy">-</div></div>
            <div class="stat-card"><h3>إجازة</h3><div class="number" id="stat-vacation">-</div></div>
            <div class="stat-card"><h3>إجمالي الرواتب</h3><div class="number" id="stat-salary">-</div><div class="small">جنيه</div></div>
        </div>
        
        <div class="filters">
            <select id="filter-status">
                <option value="all">كل الحالات</option>
                <option value="available">متاح</option>
                <option value="busy">مشغول</option>
                <option value="vacation">إجازة</option>
            </select>
            <input type="text" id="search-input" placeholder="🔍 بحث بالاسم أو التخصص أو رقم الهاتف..." style="flex:1; min-width:200px;">
            <button class="add-btn" onclick="openAddModal()">+ إضافة عامل جديد</button>
        </div>
        
        <div class="workers-table">
            <div id="workers-content" class="loading">جاري تحميل البيانات...</div>
        </div>
    </div>

    <!-- Modal لإضافة/تعديل عامل -->
    <div id="worker-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">إضافة عامل جديد</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <form id="worker-form" onsubmit="saveWorker(event)">
                <input type="hidden" id="worker-id">
                <div class="form-group">
                    <label>الاسم الكامل *</label>
                    <input type="text" id="worker-name" required>
                </div>
                <div class="form-group">
                    <label>المسمى الوظيفي *</label>
                    <input type="text" id="worker-job" required>
                </div>
                <div class="form-group">
                    <label>الراتب *</label>
                    <input type="number" id="worker-salary" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="worker-phone">
                </div>
                <div class="form-group">
                    <label>سنوات الخبرة</label>
                    <input type="number" id="worker-experience" step="0.5">
                </div>
                <div class="form-group">
                    <label>الحالة</label>
                    <select id="worker-status">
                        <option value="available">🟢 متاح</option>
                        <option value="busy">🔴 مشغول</option>
                        <option value="vacation">🟡 إجازة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رابط الصورة (اختياري)</label>
                    <input type="text" id="worker-image" placeholder="https://example.com/photo.jpg">
                </div>
                <button type="submit" class="submit-btn">💾 حفظ</button>
            </form>
        </div>
    </div>

    <script>
        let currentToken = localStorage.getItem('adminToken');
        let currentEditId = null;
        
        function checkAuth() {
            if (!currentToken) {
                window.location.href = '/admin-requests';
            }
        }
        
        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/workers/stats', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('stat-total').innerText = data.stats.total;
                    document.getElementById('stat-available').innerText = data.stats.available;
                    document.getElementById('stat-busy').innerText = data.stats.busy;
                    document.getElementById('stat-vacation').innerText = data.stats.vacation;
                    document.getElementById('stat-salary').innerText = data.stats.totalSalary.toLocaleString();
                }
            } catch(e) { console.error(e); }
        }
        
        async function fetchWorkers() {
            try {
                const status = document.getElementById('filter-status').value;
                const search = document.getElementById('search-input').value;
                
                let url = '/api/admin/workers/all?';
                if (status !== 'all') url += `status=${status}&`;
                if (search) url += `search=${encodeURIComponent(search)}&`;
                
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    renderWorkers(data.workers);
                } else {
                    document.getElementById('workers-content').innerHTML = `<div class="loading">❌ ${data.error}</div>`;
                }
            } catch(e) {
                document.getElementById('workers-content').innerHTML = '<div class="loading">❌ خطأ في الاتصال بالسيرفر</div>';
            }
        }
        
        function getStatusText(status) {
            const texts = { 'available': '🟢 متاح', 'busy': '🔴 مشغول', 'vacation': '🟡 إجازة' };
            return texts[status] || status;
        }
        
        function getStatusClass(status) {
            return `status-${status}`;
        }
        
        function renderWorkers(workers) {
            if (workers.length === 0) {
                document.getElementById('workers-content').innerHTML = '<div class="loading">📭 لا يوجد عمال حالياً</div>';
                return;
            }
            
            let html = `<table><thead><tr><th>الصورة</th><th>الاسم</th><th>المسمى الوظيفي</th><th>الراتب</th><th>الهاتف</th><th>الخبرة</th><th>الحالة</th><th>تاريخ الإضافة</th><th>إجراءات</th></tr></thead><tbody>`;
            
            for (const worker of workers) {
                const date = new Date(worker.createdAt).toLocaleDateString('ar-EG');
                const imageHtml = worker.image ? 
                    `<img src="${worker.image}" class="worker-image" onerror="this.src='https://via.placeholder.com/40'">` : 
                    `<div class="worker-image" style="background:#e2e8f0; display:flex; align-items:center; justify-content:center;">👤</div>`;
                
                html += `<tr>
                    <td>${imageHtml}</td>
                    <td><strong>${worker.name}</strong></td>
                    <td>${worker.job}</td>
                    <td>${worker.salary.toLocaleString()} ج.م</td>
                    <td>${worker.phone || '-'}</td>
                    <td>${worker.experience || 0} سنة</td>
                    <td><span class="status-badge ${getStatusClass(worker.status)}">${getStatusText(worker.status)}</span></td>
                    <td style="font-size:12px;">${date}</td>
                    <td>
                        <button class="btn-edit" onclick="openEditModal('${worker._id}')">✏️</button>
                        <button class="btn-delete" onclick="deleteWorker('${worker._id}')">🗑️</button>
                    </td>
                </tr>`;
            }
            html += `</tbody></table>`;
            document.getElementById('workers-content').innerHTML = html;
        }
        
        function openAddModal() {
            currentEditId = null;
            document.getElementById('modal-title').innerText = 'إضافة عامل جديد';
            document.getElementById('worker-form').reset();
            document.getElementById('worker-id').value = '';
            document.getElementById('worker-status').value = 'available';
            document.getElementById('worker-modal').style.display = 'flex';
        }
        
        async function openEditModal(id) {
            try {
                const res = await fetch(`/api/admin/workers/${id}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentEditId = id;
                    document.getElementById('modal-title').innerText = 'تعديل بيانات العامل';
                    document.getElementById('worker-id').value = data.worker._id;
                    document.getElementById('worker-name').value = data.worker.name;
                    document.getElementById('worker-job').value = data.worker.job;
                    document.getElementById('worker-salary').value = data.worker.salary;
                    document.getElementById('worker-phone').value = data.worker.phone || '';
                    document.getElementById('worker-experience').value = data.worker.experience || 0;
                    document.getElementById('worker-status').value = data.worker.status;
                    document.getElementById('worker-image').value = data.worker.image || '';
                    document.getElementById('worker-modal').style.display = 'flex';
                }
            } catch(e) {
                alert('خطأ في تحميل بيانات العامل');
            }
        }
        
        async function saveWorker(event) {
            event.preventDefault();
            
            const workerData = {
                name: document.getElementById('worker-name').value,
                job: document.getElementById('worker-job').value,
                salary: document.getElementById('worker-salary').value,
                phone: document.getElementById('worker-phone').value,
                experience: document.getElementById('worker-experience').value,
                status: document.getElementById('worker-status').value,
                image: document.getElementById('worker-image').value
            };
            
            const id = document.getElementById('worker-id').value;
            const url = id ? `/api/admin/workers/${id}` : '/api/admin/workers';
            const method = id ? 'PUT' : 'POST';
            
            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify(workerData)
                });
                const data = await res.json();
                if (data.success) {
                    closeModal();
                    fetchStats();
                    fetchWorkers();
                } else {
                    alert('خطأ: ' + data.error);
                }
            } catch(e) {
                alert('حدث خطأ في حفظ البيانات');
            }
        }
        
        async function deleteWorker(id) {
            if (!confirm('هل أنت متأكد من حذف هذا العامل؟')) return;
            try {
                const res = await fetch(`/api/admin/workers/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    fetchStats();
                    fetchWorkers();
                } else {
                    alert('خطأ: ' + data.error);
                }
            } catch(e) {
                alert('حدث خطأ');
            }
        }
        
        function closeModal() {
            document.getElementById('worker-modal').style.display = 'none';
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin-requests';
        }
        
        document.getElementById('filter-status').addEventListener('change', () => fetchWorkers());
        document.getElementById('search-input').addEventListener('input', () => fetchWorkers());
        
        checkAuth();
        fetchStats();
        fetchWorkers();
        
        window.onclick = function(event) {
            if (event.target === document.getElementById('worker-modal')) {
                closeModal();
            }
        }

    </script>
    <div class="nav-links">
    <a href="/admin-requests" class="nav-btn active">📋 الطلبات</a>
    <a href="/admin-workers" class="nav-btn">👷 العمال</a>
</div>
</body>
</html>
