<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Needs - في خدمتك</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/special.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#"><i class="fas fa-layer-group"></i> HomeEase</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="services.html">الخدمات</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">عن مشروعنا</a></li>
        <li class="nav-item"><a class="nav-link" href="complaints.html">💬 الشكاوى</a></li>
      </ul>
      <div class="me-auto"></div>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#contact">📞 تواصل معنا</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">🔑 تسجيل دخول</a></li>
        <li class="nav-item"><a class="nav-link" href="signup.html">👤 إنشاء حساب</a></li>
        <li class="nav-item"><a class="btn btn-primary ms-2" href="booking.html">📝 طلب خدمة</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <!-- Login Section -->
  <div class="login-box mt-4" id="loginSection">
      <h3 class="text-center">تسجيل الدخول</h3>
      <input id="phone" class="form-control mb-2" placeholder="رقم الهاتف">
      <input id="password" type="password" class="form-control mb-2" placeholder="كلمة المرور">

      <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label">Remember Me</label>
      </div>

      <button class="btn btn-primary w-100 mb-2" onclick="login()">دخول</button>
      <button class="btn btn-success w-100" onclick="voiceLogin()">🎤 تسجيل الدخول بالصوت</button>
      <p id="loginMsg" class="text-center mt-2 text-danger"></p>
  </div>

  <!-- Special Needs Section -->
  <div id="specialSection" style="display:none;" class="text-center">
    <h2>ايه المساعده اللي محتاجها؟</h2>
    <div class="mb-3">
      <button class="btn btn-warning" onclick="toggleText()">تكبير الخط</button>
      <button class="btn btn-info" onclick="toggleButtons()">تكبير الأزرار</button>
      <button class="btn btn-dark" onclick="toggleContrast()">High Contrast</button>
      <button class="btn btn-success" onclick="readPage()">🔊 قراءة الصفحة</button>
      <button class="btn btn-primary" onclick="startVoiceControl()">🎤 التحكم بالصوت</button>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-3"><div class="card card-option" onclick="selectCondition(event,'حركة')">🖐️ حركة</div></div>
      <div class="col-md-3"><div class="card card-option" onclick="selectCondition(event,'نظر')">👁️ نظر</div></div>
      <div class="col-md-3"><div class="card card-option" onclick="selectCondition(event,'سمع')">👂 سمع</div></div>
      <div class="col-md-3"><div class="card card-option" onclick="selectCondition(event,'فهم')">🧠 فهم</div></div>
      <div class="col-md-3"><div class="card card-option" onclick="openOtherModal()">➕ حالات أخرى</div></div>
    </div>

    <h3 class="mt-4">اختر الخدمة</h3>
    <div class="row justify-content-center mb-3">
      <div class="col-md-4"><button class="btn btn-primary w-100" onclick="selectService('Cleaning')">🧹 تنظيف</button></div>
      <div class="col-md-4"><button class="btn btn-primary w-100" onclick="selectService('Medical')">🏥 رعاية طبية</button></div>
      <div class="col-md-4"><button class="btn btn-primary w-100" onclick="selectService('Maintenance')">🔧 صيانة</button></div>
    </div>

    <div class="mt-3 mb-3">
      <button class="btn btn-info" onclick="getLocation()">📍 إرسال موقعي</button>
      <button class="btn btn-secondary" onclick="startRecording()">🎤 تسجيل صوت</button>
    </div>

    <button class="btn btn-success mt-4 mb-4" onclick="sendData()">تأكيد الطلب</button>
    <p id="status"></p>
  </div>

  <!-- Modal حالات أخرى -->
  <div class="modal fade" id="otherModal">
    <div class="modal-dialog">
      <div class="modal-content text-end">
        <div class="modal-header">
          <h5 class="modal-title">ايه حالتك؟</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="otherInput" class="form-control mb-2" placeholder="اكتب حالتك هنا">
          <button class="btn btn-success w-100" onclick="voiceOther()">🎤 تسجيل الحالة بالصوت</button>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" onclick="saveOther()">حفظ</button>
        </div>
      </div>
    </div>
  </div>

</div>






<script src="js/special.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
