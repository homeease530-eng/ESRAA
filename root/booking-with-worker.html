<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز خدمة - اختر العامل والموقع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 30px;
            font-family: 'Cairo', 'Tahoma', sans-serif;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .card-header h2 {
            margin: 0;
            font-size: 28px;
        }
        .card-header p {
            margin: 10px 0 0;
            opacity: 0.8;
        }
        .card-body {
            padding: 30px;
            background: #f8fafc;
        }
        .form-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .required-star {
            color: #dc2626;
        }
        .btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            font-size: 18px;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .worker-card {
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }
        .worker-card:hover {
            border-color: #10b981;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .worker-card.selected {
            border-color: #10b981;
            background: #f0fdf4;
        }
        .worker-name {
            font-weight: bold;
            font-size: 18px;
            color: #1e293b;
        }
        .worker-job {
            color: #64748b;
            font-size: 14px;
        }
        .worker-experience {
            font-size: 12px;
            color: #f59e0b;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-available {
            background: #d1fae5;
            color: #059669;
        }
        .loading-workers {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .selected-location {
            background: #e0f2fe;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 14px;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
            border-right: 4px solid #10b981;
            padding-right: 12px;
            margin-bottom: 20px;
            margin-top: 25px;
        }
        .section-title:first-of-type {
            margin-top: 0;
        }
        .no-workers {
            text-align: center;
            padding: 40px;
            background: #fef3c7;
            border-radius: 16px;
            color: #d97706;
        }
        @media (max-width: 768px) {
            .card-body {
                padding: 20px;
            }
            .section-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-calendar-check"></i> حجز خدمة منزلية</h2>
                <p>اختر الخدمة والعامل المناسب والموقع في كفر الشيخ</p>
            </div>
            <div class="card-body">
                <form id="bookingForm">
                    <!-- بيانات العميل -->
                    <div class="section-title"><i class="fas fa-user"></i> بيانات العميل</div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">الاسم الكامل <span class="required-star">*</span></label>
                            <input type="text" class="form-control" id="customerName" placeholder="أدخل اسمك كاملاً" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">رقم الهاتف <span class="required-star">*</span></label>
                            <input type="tel" class="form-control" id="customerPhone" placeholder="01xxxxxxxxx" required>
                        </div>
                    </div>

                    <!-- اختيار الخدمة -->
                    <div class="section-title"><i class="fas fa-briefcase"></i> نوع الخدمة</div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-12">
                            <select class="form-select" id="serviceType" required>
                                <option value="">-- اختر الخدمة --</option>
                                <option value="cleaning">🧹 تنظيف المنازل</option>
                                <option value="maintenance">🔧 صيانة عامة</option>
                                <option value="medical">🏥 رعاية طبية</option>
                                <option value="special-needs">🤝 دعم ذوي الاحتياجات الخاصة</option>
                            </select>
                        </div>
                    </div>

                    <!-- تحديد الموقع (كفر الشيخ) -->
                    <div class="section-title"><i class="fas fa-map-marker-alt"></i> الموقع (كفر الشيخ)</div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-12">
                            <label class="form-label">اختر المركز / المدينة <span class="required-star">*</span></label>
                            <select class="form-select" id="centerSelect">
                                <option value="">-- اختر المركز --</option>
                                <option value="kafr-sheikh">🏙️ مركز كفر الشيخ</option>
                                <option value="desouk">🏙️ مركز دسوق</option>
                                <option value="fowa">🏙️ مركز فوة</option>
                                <option value="metoubes">🏙️ مركز مطوبس</option>
                                <option value="el-hamoul">🏙️ مركز الحامول</option>
                                <option value="sidi-salem">🏙️ مركز سيدي سالم</option>
                                <option value="qallin">🏙️ مركز قلين</option>
                                <option value="belqas">🏙️ مركز بلقاس</option>
                            </select>
                        </div>
                        <div class="col-md-12" id="villageContainer" style="display: none;">
                            <label class="form-label">اختر القرية (اختياري)</label>
                            <select class="form-select" id="villageSelect">
                                <option value="">-- اختر القرية --</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">العنوان التفصيلي <span class="required-star">*</span></label>
                            <textarea class="form-control" id="address" rows="2" placeholder="مثال: شارع البحر، بجوار مسجد الرحمة، رقم 10"></textarea>
                        </div>
                        <div class="col-md-12">
                            <div class="selected-location" id="selectedLocationDisplay">
                                <i class="fas fa-info-circle"></i> سيتم عرض الموقع المختار هنا
                            </div>
                        </div>
                    </div>

                    <!-- التاريخ والوقت -->
                    <div class="section-title"><i class="fas fa-calendar-alt"></i> التاريخ والوقت</div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">التاريخ <span class="required-star">*</span></label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">الوقت <span class="required-star">*</span></label>
                            <input type="time" class="form-control" id="time" required>
                        </div>
                    </div>

                    <!-- اختيار العامل -->
                    <div class="section-title"><i class="fas fa-users"></i> اختر العامل المناسب</div>
                    <div id="workersList" class="mb-4">
                        <div class="loading-workers">
                            <i class="fas fa-spinner fa-spin"></i> يرجى اختيار الخدمة أولاً
                        </div>
                    </div>

                    <!-- ملاحظات -->
                    <div class="mb-4">
                        <label class="form-label">ملاحظات إضافية</label>
                        <textarea class="form-control" id="notes" rows="2" placeholder="أي معلومات إضافية تريد إضافتها..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-check-circle"></i> تأكيد الحجز
                    </button>
                </form>
            </div>
        </div>
    </div>

    <input type="hidden" id="userId" value="">

    <script>
        let selectedWorkerId = null;
        let currentWorkers = [];
        let selectedCenter = '';
        let selectedVillage = '';

        // تعيين الحد الأدنى للتاريخ (اليوم)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').min = today;

        // تحديث عرض الموقع
        function updateLocationDisplay() {
            const centerSelect = document.getElementById('centerSelect');
            const villageSelect = document.getElementById('villageSelect');
            const addressText = document.getElementById('address').value;
            
            let locationText = '';
            if (centerSelect.value) {
                const centerName = centerSelect.options[centerSelect.selectedIndex]?.text || '';
                locationText = `📍 ${centerName.replace('🏙️ ', '')}`;
                if (villageSelect.value) {
                    locationText += ` - ${villageSelect.value}`;
                }
                if (addressText) {
                    locationText += ` - ${addressText}`;
                }
                document.getElementById('selectedLocationDisplay').innerHTML = `
                    <i class="fas fa-map-marker-alt text-success"></i> 
                    <strong>الموقع المختار:</strong> ${locationText}
                `;
            } else {
                document.getElementById('selectedLocationDisplay').innerHTML = `
                    <i class="fas fa-info-circle"></i> يرجى اختيار المركز وكتابة عنوانك
                `;
            }
        }

        // تحميل القرى حسب المركز
        document.getElementById('centerSelect').addEventListener('change', async function() {
            const centerId = this.value;
            selectedCenter = this.options[this.selectedIndex]?.text.replace('🏙️ ', '') || '';
            
            if (centerId) {
                document.getElementById('villageContainer').style.display = 'block';
                try {
                    const response = await fetch(`/api/locations/villages/${centerId}`);
                    const data = await response.json();
                    
                    const villageSelect = document.getElementById('villageSelect');
                    villageSelect.innerHTML = '<option value="">-- اختر القرية --</option>';
                    
                    if (data.success && data.villages.length > 0) {
                        data.villages.forEach(village => {
                            villageSelect.innerHTML += `<option value="${village.name}">${village.name}</option>`;
                        });
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                document.getElementById('villageContainer').style.display = 'none';
                selectedVillage = '';
            }
            updateLocationDisplay();
        });

        document.getElementById('villageSelect').addEventListener('change', function() {
            selectedVillage = this.value;
            updateLocationDisplay();
        });

        document.getElementById('address').addEventListener('input', updateLocationDisplay);

        // عند تغيير الخدمة، جلب العمال المتاحين
        document.getElementById('serviceType').addEventListener('change', async function() {
            const serviceType = this.value;
            if (!serviceType) {
                document.getElementById('workersList').innerHTML = `
                    <div class="loading-workers">
                        <i class="fas fa-info-circle"></i> يرجى اختيار الخدمة أولاً
                    </div>`;
                return;
            }

            document.getElementById('workersList').innerHTML = `
                <div class="loading-workers">
                    <i class="fas fa-spinner fa-spin"></i> جاري تحميل العمال المتاحين...
                </div>`;

            try {
                const response = await fetch(`/api/available-workers/${serviceType}`);
                const data = await response.json();
                
                if (data.success && data.workers.length > 0) {
                    currentWorkers = data.workers;
                    displayWorkers(data.workers);
                } else {
                    document.getElementById('workersList').innerHTML = `
                        <div class="no-workers">
                            <i class="fas fa-exclamation-triangle fa-2x"></i>
                            <p class="mt-2 mb-0">لا يوجد عمال متاحون حالياً لهذه الخدمة</p>
                            <small class="text-muted">يرجى المحاولة لاحقاً</small>
                        </div>`;
                }
            } catch (error) {
                document.getElementById('workersList').innerHTML = `
                    <div class="no-workers">
                        <i class="fas fa-exclamation-circle fa-2x"></i>
                        <p class="mt-2 mb-0">حدث خطأ في تحميل البيانات</p>
                    </div>`;
            }
        });

        function displayWorkers(workers) {
            let html = '<div class="row">';
            workers.forEach(worker => {
                html += `
                    <div class="col-md-12">
                        <div class="worker-card ${selectedWorkerId === worker._id ? 'selected' : ''}" 
                             onclick="selectWorker('${worker._id}', '${worker.name}')">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="worker-name">${worker.name}</div>
                                    <div class="worker-job">${worker.job}</div>
                                    <div class="worker-experience">
                                        <i class="fas fa-star"></i> ${worker.experience || 0} سنوات خبرة
                                    </div>
                                </div>
                                <div>
                                    <span class="status-badge status-available">🟢 متاح</span>
                                </div>
                            </div>
                            ${worker.phone ? `<div class="mt-2 text-muted small"><i class="fas fa-phone"></i> ${worker.phone}</div>` : ''}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('workersList').innerHTML = html;
        }

        function selectWorker(id, name) {
            selectedWorkerId = id;
            displayWorkers(currentWorkers);
            
            Swal.fire({
                title: '✅ تم الاختيار',
                text: `لقد اخترت ${name} لتقديم الخدمة`,
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });
        }

        // تقديم الحجز
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const serviceType = document.getElementById('serviceType').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const address = document.getElementById('address').value;
            const notes = document.getElementById('notes').value;
            const centerSelect = document.getElementById('centerSelect');
            const villageSelect = document.getElementById('villageSelect');
            const userId = localStorage.getItem('userId') || null;

            const center = centerSelect.value ? centerSelect.options[centerSelect.selectedIndex]?.text.replace('🏙️ ', '') : '';
            const village = villageSelect.value || '';

            // التحقق من الحقول المطلوبة
            if (!customerName || !customerPhone || !serviceType || !date || !time || !address || !center) {
                Swal.fire('تنبيه', 'يرجى ملء جميع الحقول المطلوبة', 'warning');
                return;
            }

            if (!selectedWorkerId) {
                Swal.fire('تنبيه', 'يرجى اختيار عامل لتقديم الخدمة', 'warning');
                return;
            }

            // إنشاء العنوان الكامل
            const fullAddress = `${center}${village ? ' - ' + village : ''} - ${address}`;

            // التحقق من أن العامل لا زال متاحاً
            try {
                const checkRes = await fetch(`/api/check-worker-availability/${selectedWorkerId}`);
                const checkData = await checkRes.json();
                
                if (!checkData.available) {
                    Swal.fire('عذراً', 'العامل المختار أصبح غير متاح حالياً، يرجى اختيار عامل آخر', 'error');
                    document.getElementById('serviceType').dispatchEvent(new Event('change'));
                    selectedWorkerId = null;
                    return;
                }
            } catch (err) {
                console.error(err);
            }

            const selectedWorker = currentWorkers.find(w => w._id === selectedWorkerId);
            
            // تأكيد الحجز
            const confirm = await Swal.fire({
                title: 'تأكيد الحجز',
                html: `
                    <div style="text-align: right;">
                        <p><strong>👤 العميل:</strong> ${customerName}</p>
                        <p><strong>📞 الهاتف:</strong> ${customerPhone}</p>
                        <p><strong>🛠️ الخدمة:</strong> ${serviceType === 'cleaning' ? 'تنظيف' : serviceType === 'maintenance' ? 'صيانة' : serviceType === 'medical' ? 'رعاية طبية' : 'احتياجات خاصة'}</p>
                        <p><strong>👷 العامل:</strong> ${selectedWorker?.name || ''}</p>
                        <p><strong>📍 الموقع:</strong> ${fullAddress}</p>
                        <p><strong>📅 التاريخ:</strong> ${date}</p>
                        <p><strong>⏰ الوقت:</strong> ${time}</p>
                    </div>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'نعم، تأكيد',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#10b981'
            });

            if (!confirm.isConfirmed) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحجز...';

            try {
                const response = await fetch('/api/book-with-worker', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId,
                        serviceName: serviceType,
                        customerName,
                        customerPhone,
                        date,
                        time,
                        address: fullAddress,
                        notes,
                        workerId: selectedWorkerId,
                        workerName: selectedWorker?.name
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // رسالة النجاح مع رقم الحجز وكود الوصول
                    Swal.fire({
                        title: '✅ تم الحجز بنجاح!',
                        html: `
                            <div style="text-align: center;">
                                <p style="color: #10b981; font-weight: bold;">${data.message}</p>
                                <hr>
                                <div style="background: linear-gradient(135deg, #d1fae5, #a7f3d0); padding: 15px; border-radius: 12px; margin: 15px 0;">
                                    <p style="margin: 0; font-size: 13px; color: #047857;">🔑 كود الوصول</p>
                                    <p style="font-size: 32px; font-weight: bold; letter-spacing: 4px; font-family: monospace; margin: 5px 0; color: #065f46;">${data.arrivalCode}</p>
                                    <p class="text-muted small mb-0">أعط هذا الكود للعامل عند وصوله</p>
                                </div>
                                <div style="background: #f1f5f9; padding: 15px; border-radius: 12px; margin: 15px 0;">
                                    <p style="margin: 0; font-size: 13px; color: #64748b;">🔑 رقم الحجز</p>
                                    <p style="font-size: 14px; font-weight: bold; font-family: monospace; margin: 5px 0 0 0; word-break: break-all;">${data.bookingId}</p>
                                </div>
                                <div style="background: #fef3c7; padding: 12px; border-radius: 12px; margin: 10px 0;">
                                    <i class="fas fa-info-circle text-warning"></i>
                                    <small>احتفظ برقم الحجز وكود الوصول لتأكيد إتمام الخدمة لاحقاً</small>
                                </div>
                            </div>
                        `,
                        icon: 'success',
                        confirmButtonText: 'حسناً',
                        confirmButtonColor: '#10b981'
                    }).then(() => {
                        // إعادة تعيين النموذج
                        document.getElementById('bookingForm').reset();
                        selectedWorkerId = null;
                        selectedCenter = '';
                        selectedVillage = '';
                        document.getElementById('workersList').innerHTML = `
                            <div class="loading-workers">
                                <i class="fas fa-info-circle"></i> يرجى اختيار الخدمة أولاً
                            </div>`;
                        document.getElementById('selectedLocationDisplay').innerHTML = `
                            <i class="fas fa-info-circle"></i> سيتم عرض الموقع المختار هنا
                        `;
                        document.getElementById('villageContainer').style.display = 'none';
                    });
                } else {
                    Swal.fire('خطأ', data.message || 'حدث خطأ في الحجز', 'error');
                }
            } catch (error) {
                console.error(error);
                Swal.fire('خطأ', 'حدث خطأ في الاتصال بالسيرفر', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> تأكيد الحجز';
            }
        });
    </script>
</body>
</html>
