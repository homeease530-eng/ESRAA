<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - الطلبات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: #f5f7fb;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 {
            color: #1e293b;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            background: white;
            color: #2563eb;
            border: 1px solid #e2e8f0;
        }
        .nav-btn.active {
            background: #2563eb;
            color: white;
        }
        .logout-btn {
            background: #dc2626;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filters select, .filters input {
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
        }
        .requests-table {
            background: white;
            border-radius: 20px;
            overflow-x: auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        th, td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f8fafc;
            color: #1e293b;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-processing { background: #dbeafe; color: #2563eb; }
        .status-approved { background: #d1fae5; color: #059669; }
        .status-rejected { background: #fee2e2; color: #dc2626; }
        .status-completed { background: #d1fae5; color: #059669; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }
        .type-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .type-contact { background: #e0e7ff; color: #4338ca; }
        .type-complaint { background: #fce7f3; color: #db2777; }
        .type-special-need { background: #d1fae5; color: #047857; }
        .type-quick-booking { background: #fed7aa; color: #c2410c; }
        .type-job-application { background: #e9d5ff; color: #7e22ce; }
        button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin: 0 3px;
            padding: 5px;
        }
        .btn-view { color: #2563eb; }
        .btn-delete { color: #dc2626; }
        .btn-approve { color: #059669; font-size: 20px; }
        .btn-reject { color: #dc2626; font-size: 20px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 25px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-modal {
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
        }
        .detail-item {
            margin-bottom: 15px;
        }
        .detail-label {
            font-weight: bold;
            color: #475569;
            margin-bottom: 5px;
        }
        .detail-value {
            color: #1e293b;
            background: #f8fafc;
            padding: 10px;
            border-radius: 12px;
            word-break: break-word;
        }
        .file-link {
            display: inline-block;
            padding: 8px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
        }
        .file-link:hover {
            background: #1d4ed8;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        .approve-btn {
            background: #059669;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .reject-btn {
            background: #dc2626;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .map-link {
            color: #2563eb;
            text-decoration: none;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-pending { background: #fef3c7; color: #d97706; }
        @media (max-width: 768px) {
            th, td {
                padding: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 لوحة تحكم الأدمن</h1>
            <div class="nav-links">
                <a href="/admin-requests" class="nav-btn active">📋 الطلبات</a>
                <a href="/admin-workers" class="nav-btn">👷 العمال</a>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 تسجيل خروج</button>
        </div>
        
        <div class="stats" id="stats-container">
            <div class="stat-card"><h3>📞 اتصالات</h3><div class="number" id="stat-contacts">-</div></div>
            <div class="stat-card"><h3>⚠️ شكاوى</h3><div class="number" id="stat-complaints">-</div></div>
            <div class="stat-card"><h3>🤝 احتياجات خاصة</h3><div class="number" id="stat-special">-</div></div>
            <div class="stat-card"><h3>⚡ حجوزات سريعة</h3><div class="number" id="stat-quick">-</div></div>
            <div class="stat-card"><h3>💼 طلبات توظيف</h3><div class="number" id="stat-jobs">-</div></div>
        </div>
        
        <div class="filters">
            <select id="filter-type">
                <option value="all">كل الطلبات</option>
                <option value="contact">اتصال بنا</option>
                <option value="complaint">شكاوى</option>
                <option value="special-need">احتياجات خاصة</option>
                <option value="quick-booking">حجز سريع</option>
                <option value="job-application">طلب توظيف</option>
            </select>
            <select id="filter-status">
                <option value="all">كل الحالات</option>
                <option value="pending">⏳ قيد الانتظار</option>
                <option value="processing">🔄 قيد المعالجة</option>
                <option value="approved">✅ مقبول</option>
                <option value="rejected">❌ مرفوض</option>
                <option value="completed">✅ مكتمل</option>
                <option value="cancelled">❌ ملغي</option>
            </select>
            <input type="text" id="search-input" placeholder="🔍 بحث بالاسم أو رقم الهاتف..." style="flex:1; min-width:200px;">
        </div>
        
        <div class="requests-table">
            <div id="requests-content" class="loading">جاري تحميل البيانات...</div>
        </div>
    </div>

    <!-- Modal للتفاصيل -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">تفاصيل الطلب</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body"></div>
            <div id="modal-actions" class="action-buttons"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let currentToken = localStorage.getItem('adminToken');
        let currentRequests = [];
        let currentModalRequest = null;
        
        function checkAuth() {
            if (!currentToken) {
                const userToken = prompt('🔐 الرجاء إدخال توكن المشرف للدخول:');
                if (userToken) {
                    currentToken = userToken;
                    localStorage.setItem('adminToken', userToken);
                    fetchStats();
                    fetchAllRequests();
                } else {
                    document.getElementById('requests-content').innerHTML = '<div class="loading">❌ غير مصرح - الرجاء تسجيل الدخول كمسؤول</div>';
                }
            } else {
                fetchStats();
                fetchAllRequests();
            }
        }
        
        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('stat-contacts').innerText = data.stats.contacts;
                    document.getElementById('stat-complaints').innerText = data.stats.complaints;
                    document.getElementById('stat-special').innerText = data.stats.specialNeeds;
                    document.getElementById('stat-quick').innerText = data.stats.quickBookings;
                    document.getElementById('stat-jobs').innerText = data.stats.jobApplications;
                }
            } catch(e) { console.error(e); }
        }
        
        async function fetchAllRequests() {
            try {
                const res = await fetch('/api/admin/all-requests', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentRequests = data.requests;
                    applyFilters();
                } else {
                    document.getElementById('requests-content').innerHTML = `<div class="loading">❌ ${data.error || 'غير مصرح'}</div>`;
                }
            } catch(e) {
                document.getElementById('requests-content').innerHTML = '<div class="loading">❌ خطأ في الاتصال بالسيرفر</div>';
            }
        }
        
        function getStatusText(status) {
            const texts = {
                'pending': '⏳ قيد الانتظار',
                'processing': '🔄 قيد المعالجة',
                'approved': '✅ مقبول',
                'rejected': '❌ مرفوض',
                'completed': '✅ مكتمل',
                'cancelled': '❌ ملغي'
            };
            return texts[status] || status;
        }
        
        function getStatusClass(status) {
            return `status-${status}`;
        }
        
        function getTypeText(type) {
            const texts = {
                'contact': '📞 اتصال بنا',
                'complaint': '⚠️ شكوى',
                'special-need': '🤝 احتياجات خاصة',
                'quick-booking': '⚡ حجز سريع',
                'job-application': '💼 طلب توظيف'
            };
            return texts[type] || type;
        }
        
        function getTypeClass(type) {
            return `type-${type}`;
        }
        
        function getDisplayText(request) {
            if (request.type === 'contact') return request.name || request.email;
            if (request.type === 'complaint') return request.name || request.email;
            if (request.type === 'special-need') return request.phone || request.condition;
            if (request.type === 'quick-booking') return request.name || request.phone;
            if (request.type === 'job-application') return request.fullName || request.phone;
            return '-';
        }
        
        async function updateStatus(type, id, newStatus) {
            try {
                const res = await fetch(`/api/admin/request/${type}/${id}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    if (data.workerAdded) {
                        Swal.fire({
                            title: '✅ تمت الموافقة!',
                            text: 'تم قبول الطلب وتم إضافة العامل إلى قائمة العمال',
                            icon: 'success',
                            confirmButtonText: 'حسنًا'
                        });
                    } else if (newStatus === 'approved') {
                        Swal.fire({
                            title: '✅ تمت الموافقة!',
                            text: data.message || 'تم قبول الطلب بنجاح',
                            icon: 'success',
                            confirmButtonText: 'حسنًا'
                        });
                    } else if (newStatus === 'rejected') {
                        Swal.fire({
                            title: '❌ تم الرفض',
                            text: 'تم رفض الطلب',
                            icon: 'info',
                            confirmButtonText: 'حسنًا'
                        });
                    } else {
                        Swal.fire({
                            title: 'تم التحديث',
                            text: 'تم تحديث حالة الطلب بنجاح',
                            icon: 'success',
                            confirmButtonText: 'حسنًا'
                        });
                    }
                    fetchAllRequests();
                    fetchStats();
                } else {
                    Swal.fire({
                        title: 'خطأ',
                        text: data.error || 'حدث خطأ',
                        icon: 'error'
                    });
                }
            } catch(e) {
                Swal.fire({
                    title: 'خطأ',
                    text: 'حدث خطأ في الاتصال',
                    icon: 'error'
                });
            }
        }
        
        async function deleteRequest(type, id) {
            const result = await Swal.fire({
                title: 'هل أنت متأكد؟',
                text: 'هل تريد حذف هذا الطلب؟',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء'
            });
            if (!result.isConfirmed) return;
            
            try {
                const res = await fetch(`/api/admin/request/${type}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire('تم الحذف', 'تم حذف الطلب بنجاح', 'success');
                    fetchAllRequests();
                    fetchStats();
                } else {
                    Swal.fire('خطأ', data.error, 'error');
                }
            } catch(e) {
                Swal.fire('خطأ', 'حدث خطأ في الاتصال', 'error');
            }
        }
        
        async function approveJobApplication(id) {
            const result = await Swal.fire({
                title: '✅ الموافقة على الطلب',
                text: 'هل أنت متأكد من الموافقة على هذا الطلب؟ سيتم إضافة العامل تلقائياً إلى قائمة العمال',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'نعم، أوافق',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#059669'
            });
            if (result.isConfirmed) {
                await updateStatus('job-application', id, 'approved');
            }
        }
        
        async function rejectJobApplication(id) {
            const result = await Swal.fire({
                title: '❌ رفض الطلب',
                text: 'هل أنت متأكد من رفض هذا الطلب؟',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'نعم، ارفض',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#dc2626'
            });
            if (result.isConfirmed) {
                await updateStatus('job-application', id, 'rejected');
            }
        }
        
        function getFieldName(key) {
            const names = {
                'fullName': '👤 الاسم الكامل',
                'name': '👤 الاسم',
                'phone': '📞 رقم الهاتف',
                'email': '📧 البريد الإلكتروني',
                'address': '🏠 العنوان',
                'dob': '📅 تاريخ الميلاد',
                'gender': '⚥ الجنس',
                'qualification': '🎓 المؤهل الدراسي',
                'experience': '⏱️ سنوات الخبرة',
                'certificates': '📜 الشهادات',
                'skills': '🔧 المهارات',
                'serviceType': '🛠️ نوع الخدمة',
                'availability': '⏰ ساعات العمل',
                'notes': '📝 ملاحظات',
                'message': '💬 الرسالة',
                'service': '🛠️ الخدمة',
                'details': '📋 التفاصيل',
                'complaintType': '⚠️ نوع الشكوى',
                'condition': '🩺 نوع الإعاقة',
                'otherCondition': '📝 إعاقة أخرى',
                'voiceNote': '🎙️ ملاحظة صوتية',
                'source': '📱 المصدر',
                'criminalRecordPath': '📄 الفيش الجنائي',
                'location': '📍 الموقع',
                'createdAt': '📅 تاريخ التقديم',
                'status': '🏷️ الحالة'
            };
            return names[key] || key;
        }
        
        async function viewDetails(request) {
            currentModalRequest = request;
            document.getElementById('modal-title').innerText = getTypeText(request.type);
            
            let html = '';
            
            for (const [key, value] of Object.entries(request)) {
                if (key === 'id' || key === 'type' || key === 'typeAr' || key === '__v') continue;
                
                let displayValue = value;
                
                if (key === 'criminalRecordPath' && value) {
                    displayValue = `<a href="/${value}" target="_blank" class="file-link">📄 عرض الفيش الجنائي</a>`;
                } else if (key === 'location' && value && value.lat) {
                    displayValue = `<a href="https://www.google.com/maps?q=${value.lat},${value.lng}" target="_blank" class="map-link">📍 عرض الموقع على الخريطة</a><br>
                                    <small>العنوان: ${value.address || 'غير متوفر'}</small><br>
                                    <small>الإحداثيات: ${value.lat}, ${value.lng}</small>`;
                } else if (typeof value === 'object') {
                    displayValue = JSON.stringify(value, null, 2);
                } else if (key === 'createdAt') {
                    displayValue = new Date(value).toLocaleString('ar-EG');
                } else if (key === 'gender') {
                    displayValue = value === 'male' ? 'ذكر' : (value === 'female' ? 'أنثى' : value);
                } else if (key === 'availability') {
                    const availTexts = { 'fulltime': 'دوام كامل', 'parttime': 'دوام جزئي', 'flexible': 'مرن' };
                    displayValue = availTexts[value] || value;
                } else if (key === 'serviceType') {
                    const serviceTexts = { 'cleaning': 'تنظيف', 'maintenance': 'صيانة', 'medical': 'رعاية طبية', 'special': 'احتياجات خاصة' };
                    displayValue = serviceTexts[value] || value;
                }
                
                if (displayValue && displayValue !== '-') {
                    html += `<div class="detail-item">
                                <div class="detail-label">${getFieldName(key)}:</div>
                                <div class="detail-value">${displayValue}</div>
                             </div>`;
                }
            }
            
            document.getElementById('modal-body').innerHTML = html;
            
            let actionsHtml = '';
            if (request.type === 'job-application' && request.status === 'pending') {
                actionsHtml = `
                    <button class="approve-btn" onclick="approveJobApplication('${request.id}')">✅ موافقة وقبول العامل</button>
                    <button class="reject-btn" onclick="rejectJobApplication('${request.id}')">❌ رفض الطلب</button>
                `;
            }
            document.getElementById('modal-actions').innerHTML = actionsHtml;
            
            document.getElementById('details-modal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('details-modal').style.display = 'none';
            currentModalRequest = null;
        }
        
        function applyFilters() {
            const typeFilter = document.getElementById('filter-type').value;
            const statusFilter = document.getElementById('filter-status').value;
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = currentRequests;
            
            if (typeFilter !== 'all') {
                filtered = filtered.filter(r => r.type === typeFilter);
            }
            if (statusFilter !== 'all') {
                filtered = filtered.filter(r => r.status === statusFilter);
            }
            if (searchTerm) {
                filtered = filtered.filter(r => {
                    const searchable = `${r.name || ''} ${r.fullName || ''} ${r.phone || ''} ${r.email || ''}`.toLowerCase();
                    return searchable.includes(searchTerm);
                });
            }
            
            renderTable(filtered);
        }
        
        function renderTable(requests) {
            if (requests.length === 0) {
                document.getElementById('requests-content').innerHTML = '<div class="loading">📭 لا توجد طلبات حالياً</div>';
                return;
            }
            
            let html = `<table><thead><tr>
                <th>النوع</th>
                <th>الاسم / رقم الهاتف</th>
                <th>التفاصيل</th>
                <th>الحالة</th>
                <th>التاريخ</th>
                <th>الإجراءات</th>
            </td></thead><tbody>`;
            
            for (const req of requests) {
                const date = new Date(req.createdAt).toLocaleString('ar-EG');
                const isPendingJob = (req.type === 'job-application' && req.status === 'pending');
                
                let detailsText = req.message || req.details || req.serviceType || req.service || req.condition || '-';
                if (detailsText.length > 50) detailsText = detailsText.substring(0, 50) + '...';
                
                html += `<tr>
                    <td><span class="type-badge ${getTypeClass(req.type)}">${getTypeText(req.type)}</span></td>
                    <td><strong>${getDisplayText(req)}</strong></td>
                    <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${detailsText}</td>
                    <td><span class="status-badge ${getStatusClass(req.status)}">${getStatusText(req.status)}</span></td>
                    <td style="font-size:12px;">${date}</td>
                    <td style="white-space: nowrap;">
                        <button class="btn-view" onclick='viewDetails(${JSON.stringify(req).replace(/'/g, "&#39;")})' title="عرض التفاصيل">👁️</button>
                        ${isPendingJob ? `<button class="btn-approve" onclick="approveJobApplication('${req.id}')" title="موافقة">✅</button>` : ''}
                        ${isPendingJob ? `<button class="btn-reject" onclick="rejectJobApplication('${req.id}')" title="رفض">❌</button>` : ''}
                        <button class="btn-delete" onclick="deleteRequest('${req.type}', '${req.id}')" title="حذف">🗑️</button>
                    </td>
                </tr>`;
            }
            html += `</tbody></table>`;
            document.getElementById('requests-content').innerHTML = html;
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            currentToken = null;
            document.getElementById('requests-content').innerHTML = '<div class="loading">🔐 تم تسجيل الخروج، يرجى تحديث الصفحة للدخول مرة أخرى</div>';
            document.getElementById('stats-container').innerHTML = '<div class="stat-card"><h3>📞 اتصالات</h3><div class="number">-</div></div><div class="stat-card"><h3>⚠️ شكاوى</h3><div class="number">-</div></div><div class="stat-card"><h3>🤝 احتياجات خاصة</h3><div class="number">-</div></div><div class="stat-card"><h3>⚡ حجوزات سريعة</h3><div class="number">-</div></div><div class="stat-card"><h3>💼 طلبات توظيف</h3><div class="number">-</div></div>';
        }
        
        document.getElementById('filter-type').addEventListener('change', applyFilters);
        document.getElementById('filter-status').addEventListener('change', applyFilters);
        document.getElementById('search-input').addEventListener('input', applyFilters);
        
        checkAuth();
        
        window.onclick = function(event) {
            if (event.target === document.getElementById('details-modal')) {
                closeModal();
            }
        }

        <!-- في دالة renderWorkers -->
function getStatusText(status) {
    const texts = { 
        'available': '🟢 متاح', 
        'busy': '🔴 مشغول', 
        'vacation': '🟡 إجازة' 
    };
    return texts[status] || status;
}

// في تفاصيل الطلب، أضف:
if (booking.beforeImagePath) {
    html += `<div><strong>صورة قبل الخدمة:</strong> <a href="/${booking.beforeImagePath}" target="_blank">📸 عرض</a></div>`;
}
if (booking.afterImagePath) {
    html += `<div><strong>صورة بعد الخدمة:</strong> <a href="/${booking.afterImagePath}" target="_blank">📸 عرض</a></div>`;
}
if (booking.arrivalVerified) {
    html += `<div><strong>⏱️ وقت الوصول:</strong> ${new Date(booking.arrivalTime).toLocaleString('ar-EG')}</div>`;
}
if (booking.customerConfirmation) {
    html += `<div><strong>✅ تأكيد العميل:</strong> تم تأكيد إتمام الخدمة</div>`;
}
