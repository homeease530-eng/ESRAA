<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العمال - في خدمتك</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --primary: #4e73df;
    --success: #1cc88a;
    --danger: #e74a3b;
    --dark: #5a5c69;
    --bg-body: #f8f9fc;
}
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-body);
    padding-top: 70px;
}
.navbar { background: #1a1a2e !important; }
header {
    background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    border-radius: 0 0 30px 30px;
    margin-top: -20px;
}
.admin-container {
    max-width: 1200px;
    margin: -40px auto 40px;
    padding: 0 20px;
}
.stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}
.stat-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    border-right: 5px solid var(--primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.stat-card span { font-size: 22px; font-weight: bold; color: #333; }
.top-bar {
    display: flex;
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 25px;
    gap: 15px;
    align-items: center;
}
.top-bar input {
    flex: 1;
    padding: 12px 20px;
    border-radius: 25px;
    border: 1px solid #e3e6f0;
}
.btn-add {
    background: var(--success);
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}
.worker-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    transition: 0.3s;
    border: 1px solid #edf0f7;
    position: relative;
}
.worker-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
.img-box { width: 100%; height: 180px; overflow: hidden; }
.img-box img { width: 100%; height: 100%; object-fit: cover; }
.info-box { padding: 20px; text-align: center; }
.info-box h3 { margin: 0 0 5px; font-size: 18px; }
.info-box .job { color: var(--primary); font-weight: 600; font-size: 14px; }
.info-box .salary { background: #f1f3f9; display: inline-block; padding: 5px 15px; border-radius: 15px; font-weight: bold; }
.actions {
    display: flex;
    border-top: 1px solid #f1f3f9;
    background: #fafbfc;
}
.actions button {
    flex: 1;
    padding: 12px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 13px;
}
.actions .btn-delete:hover { color: var(--danger); }
.badge {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 5px 12px;
    border-radius: 20px;
    color: white;
    font-size: 11px;
    font-weight: bold;
}
.bg-available { background: var(--success); }
.bg-busy { background: var(--danger); }
.modal-custom {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}
.modal-content {
    background: white;
    border-radius: 20px;
    padding: 30px;
    max-width: 500px;
    width: 90%;
    position: relative;
}
.close-modal {
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 24px;
    cursor: pointer;
}
.modal-content input, .modal-content select {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
}
.btn-save { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
.btn-cancel { background: #858796; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-right: 10px; }
.loading { text-align: center; padding: 40px; }
.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="fas fa-layer-group"></i> HomeEase
    </a>
    <div class="ms-auto">
      <span id="adminName" class="text-white me-3">مرحباً</span>
      <button class="btn btn-danger btn-sm" onclick="logout()">تسجيل خروج</button>
    </div>
  </div>
</nav>

<header>👥 إدارة العمال</header>

<div class="admin-container">
    <div class="stats-bar">
        <div class="stat-card"><div><h4>إجمالي العمال</h4><span id="totalWorkers">0</span></div><div style="font-size: 30px;">👥</div></div>
        <div class="stat-card"><div><h4>متاح الآن</h4><span id="availableWorkers">0</span></div><div style="font-size: 30px;">✅</div></div>
        <div class="stat-card"><div><h4>في مهمة</h4><span id="busyWorkers">0</span></div><div style="font-size: 30px;">🛠️</div></div>
    </div>

    <div class="top-bar">
        <input type="text" id="search" placeholder="🔍 ابحث عن اسم العامل أو التخصص...">
        <button class="btn-add" onclick="openAddModal()">+ إضافة عامل جديد</button>
    </div>

    <div class="grid" id="workerGrid">
        <div class="loading"><div class="spinner"></div><p>جاري تحميل العمال...</p></div>
    </div>
</div>

<!-- Modal -->
<div id="workerModal" class="modal-custom">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3 class="text-center mb-3">إضافة عامل جديد</h3>
        <input type="text" id="workerName" placeholder="الاسم الكامل" required>
        <input type="text" id="workerJob" placeholder="التخصص" required>
        <input type="number" id="workerSalary" placeholder="الراتب" required>
        <input type="text" id="workerImage" placeholder="رابط الصورة">
        <select id="workerStatus">
            <option value="available">متاح</option>
            <option value="busy">مشغول</option>
        </select>
        <div class="text-center mt-3">
            <button class="btn-save" onclick="saveWorker()">💾 حفظ</button>
            <button class="btn-cancel" onclick="closeModal()">❌ إلغاء</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let token = localStorage.getItem('token');
    let userRole = localStorage.getItem('userRole');
    let userEmail = localStorage.getItem('userEmail');
    let workers = [];

    if (!token) {
        window.location.href = 'login.html';
    }

    // السماح فقط لـ admin@service.com
    if (userRole !== 'admin' || userEmail !== 'admin@service.com') {
        alert('❌ هذه الصفحة مخصصة للمشرف المحدد فقط (admin@service.com)');
        window.location.href = 'dashboard.html';
    }

    document.getElementById('adminName').innerHTML = `مرحباً ${localStorage.getItem('userName') || 'مشرف'}`;
    
    function logout() { 
        localStorage.clear(); 
        window.location.href = 'login.html'; 
    }

    async function loadWorkers() {
        try {
            const response = await fetch('/api/workers', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success && data.workers) {
                workers = data.workers;
                displayWorkers(workers);
                updateStats();
            } else {
                document.getElementById('workerGrid').innerHTML = '<div class="text-center text-muted">❌ لا يوجد عمال</div>';
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('workerGrid').innerHTML = '<div class="text-center text-danger">❌ خطأ في تحميل البيانات</div>';
        }
    }

    function displayWorkers(workersList) {
        const container = document.getElementById('workerGrid');
        if (workersList.length === 0) {
            container.innerHTML = '<div class="text-center text-muted">🚫 لا يوجد عمال</div>';
            return;
        }
        container.innerHTML = workersList.map(worker => `
            <div class="worker-card">
                <span class="badge ${worker.status === 'available' ? 'bg-available' : 'bg-busy'}">${worker.status === 'available' ? 'متاح' : 'مشغول'}</span>
                <div class="img-box">
                    <img src="${worker.image || 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400'}" alt="${worker.name}">
                </div>
                <div class="info-box">
                    <h3>${worker.name}</h3>
                    <div class="job">${worker.job}</div>
                    <div class="salary">${worker.salary.toLocaleString()} ج.م</div>
                </div>
                <div class="actions">
                    <button onclick="editWorker('${worker._id}')">📝 تعديل</button>
                    <button class="btn-delete" onclick="deleteWorker('${worker._id}')">🗑️ حذف</button>
                </div>
            </div>
        `).join('');
    }

    function updateStats() {
        document.getElementById('totalWorkers').innerText = workers.length;
        document.getElementById('availableWorkers').innerText = workers.filter(w => w.status === 'available').length;
        document.getElementById('busyWorkers').innerText = workers.filter(w => w.status === 'busy').length;
    }

    document.getElementById('search').addEventListener('keyup', function() {
        let term = this.value.toLowerCase();
        const filtered = workers.filter(w => w.name.toLowerCase().includes(term) || w.job.toLowerCase().includes(term));
        displayWorkers(filtered);
    });

    function openAddModal() {
        document.getElementById('workerName').value = '';
        document.getElementById('workerJob').value = '';
        document.getElementById('workerSalary').value = '';
        document.getElementById('workerImage').value = '';
        document.getElementById('workerStatus').value = 'available';
        document.getElementById('workerModal').style.display = 'flex';
    }

    async function saveWorker() {
        const workerData = {
            name: document.getElementById('workerName').value,
            job: document.getElementById('workerJob').value,
            salary: parseInt(document.getElementById('workerSalary').value),
            image: document.getElementById('workerImage').value,
            status: document.getElementById('workerStatus').value,
            phone: '',
            experience: 0
        };
        if (!workerData.name || !workerData.job || !workerData.salary) {
            alert('❌ يرجى ملء جميع الحقول المطلوبة');
            return;
        }
        try {
            const response = await fetch('/api/workers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(workerData)
            });
            const data = await response.json();
            if (data.success) {
                alert('✅ تم إضافة العامل بنجاح');
                closeModal();
                loadWorkers();
            } else {
                alert('❌ فشل الحفظ: ' + (data.error || 'خطأ غير معروف'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('❌ خطأ في الاتصال');
        }
    }

    async function deleteWorker(id) {
        if (confirm('⚠️ هل أنت متأكد من حذف هذا العامل؟')) {
            try {
                const response = await fetch(`/api/workers/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    alert('✅ تم حذف العامل بنجاح');
                    loadWorkers();
                } else {
                    alert('❌ فشل الحذف: ' + (data.error || 'خطأ غير معروف'));
                }
            } catch (error) {
                alert('❌ خطأ في الاتصال');
            }
        }
    }

    function editWorker(id) {
        alert(`📝 تعديل بيانات العامل (رقم: ${id})\nسيتم إضافة هذه الميزة قريباً`);
    }

    function closeModal() {
        document.getElementById('workerModal').style.display = 'none';
    }

    loadWorkers();
</script>
</body>
</html>
